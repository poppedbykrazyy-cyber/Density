name: Build OrbitalStrike

on:
  push:
    paths:
      - 'OrbitalStrike/**'
      - '.github/workflows/orbitalstrike.yml'
  pull_request:
    paths:
      - 'OrbitalStrike/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn -B -f OrbitalStrike/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitalStrike-plugin
          path: OrbitalStrike/target/OrbitalStrike-*.jar
